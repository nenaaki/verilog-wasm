<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>verilog-wasm — 回路エディタ</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel2: #1e222b;
    --line: #2b303b;
    --fg: #dfe3ea;
    --dim: #8b93a3;
    --blue: #5aa2ff;
    --green: #4ec98a;
    --amber: #e3b341;
    --red: #f0776c;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  /* hidden 属性は UA の [hidden]{display:none} が .bar{display:flex} に負けるので明示する */
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 system-ui, "Segoe UI", "Yu Gothic UI", sans-serif;
    /* header / ツールバー 2 段 / 回路 / 区切り / 波形 / メッセージ */
    display: grid; grid-template-rows: auto auto auto 1fr 7px 150px auto; overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  header .sub { color: var(--dim); font-size: 11px; }
  header .stats { margin-left: auto; color: var(--dim); font-family: var(--mono); font-size: 11px; }
  header a { color: var(--blue); font-size: 11px; text-decoration: none; }
  header a:hover { text-decoration: underline; }

  .bar {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 7px 12px; border-bottom: 1px solid var(--line); background: var(--panel2);
  }
  .bar .label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .bar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }

  select, button {
    background: #232833; color: var(--fg); border: 1px solid var(--line);
    border-radius: 5px; padding: 4px 9px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--blue); }
  button.part { font-family: var(--mono); font-size: 11.5px; }
  button.primary { background: #1d3a63; border-color: #2f5d9e; }
  button:disabled { color: #59606d; background: #1b1f27; border-color: var(--line); cursor: default; }
  button:disabled:hover { border-color: var(--line); }
  .bar .cyc { color: var(--dim); font-family: var(--mono); font-size: 11px; min-width: 62px; }
  .bar input[type=text] { width: 132px; background: #232833; color: var(--fg);
    border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; font: inherit; }

  main { display: grid; grid-template-columns: 1fr 7px minmax(240px, 30%); min-height: 0; }
  #canvasWrap { position: relative; min-width: 0; min-height: 0; overflow: hidden; background:
    radial-gradient(circle at 1px 1px, #232833 1px, transparent 0) 0 0 / 20px 20px, #0c0e12; }
  #svg { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
  #svg.panning { cursor: grabbing; }

  /* ペインの区切り。つまんでドラッグするとサイズが変わる */
  .split { background: var(--line); }
  .split:hover, .split.active { background: var(--blue); }
  .split.v { cursor: col-resize; }
  .split.h { cursor: row-resize; }

  aside { display: grid; grid-template-rows: auto 1fr 7px auto 1fr; min-height: 0; min-width: 0; }
  aside .head { padding: 5px 12px; background: var(--panel2); border-bottom: 1px solid var(--line);
    color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  aside .scroll { overflow: auto; min-height: 0; background: #0c0e12; }
  pre#verilog { margin: 0; padding: 10px 12px; font-family: var(--mono); font-size: 11.5px; color: #a9b3c4; }

  table#truth { border-collapse: collapse; font-family: var(--mono); font-size: 11.5px; margin: 8px 12px; }
  table#truth th, table#truth td { border: 1px solid var(--line); padding: 1px 7px; text-align: center; }
  table#truth th { background: var(--panel2); color: var(--dim); font-weight: 500; }
  table#truth td.one { color: var(--green); }
  table#truth td.zero { color: #4b5262; }
  table#truth .gap { border-top: 0; border-bottom: 0; background: var(--panel); }
  table#truth tr.now td { background: #223044; }        /* 今の入力・メモリの行 */
  table#truth tr.now td.gap { background: #223044; }

  /* --- 波形パネル --- */
  #wavePanel { display: grid; grid-template-rows: auto 1fr; min-height: 0; background: #0c0e12; }
  .bar.wavebar { padding: 4px 12px; border-bottom: 1px solid var(--line); }
  .bar.wavebar input[type=number] {
    width: 58px; font-family: var(--mono); background: #232833; color: var(--fg);
    border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; font-size: 12px;
  }
  .bar .chk { color: var(--dim); font-size: 11px; display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #waveScroll { overflow: auto; min-height: 0; }
  #waveRow { display: flex; align-items: flex-start; width: max-content; }
  /* 名前の列は横スクロールしても左に残す */
  #waveNames { position: sticky; left: 0; z-index: 1; background: var(--panel); flex: none;
    border-right: 1px solid var(--line); }
  #waveSvg { flex: none; }
  #waveNames text { font-family: var(--mono); font-size: 11px; fill: var(--dim); dominant-baseline: central; }
  #waveNames text.reg { fill: var(--blue); }
  #waveNames text.out { fill: var(--amber); }
  #waveNames text.block { fill: #7fd6b8; }
  /* カーソル位置の値。名前より目立たせる */
  #waveNames text.val { fill: var(--fg); text-anchor: end; font-size: 11.5px; }
  #waveSvg .cursor { fill: #5aa2ff; fill-opacity: .14; stroke: var(--blue); stroke-width: 1; }
  #waveSvg { cursor: crosshair; }
  #waveSvg .lane { stroke: #262b36; stroke-width: 1; }
  #waveSvg .cyc { font-family: var(--mono); font-size: 9.5px; fill: #6b7382; text-anchor: middle; }
  #waveSvg .edge { stroke: #232833; stroke-width: 1; }
  #waveSvg path.sig { fill: none; stroke: var(--green); stroke-width: 1.8; stroke-linejoin: round; }
  #waveSvg path.sig.unknown { stroke: #4b5262; stroke-dasharray: 3 3; }
  /* 幅 2 以上は階段では表せないので、列ごとに値の箱を出す */
  #waveSvg rect.bus { fill: #16281f; stroke: var(--green); stroke-width: 1; }
  #waveSvg text.busval { font-family: var(--mono); font-size: 8.5px; fill: #b8e6cd;
    text-anchor: middle; dominant-baseline: central; }
  #waveSvg .busg.unknown rect.bus { fill: #1a1d24; stroke: #4b5262; stroke-dasharray: 2 2; }
  #waveSvg .busg.unknown text.busval { fill: #6b7382; }
  #waveSvg path.bus-marker { stroke: none; }
  #waveSvg .note { font-family: var(--mono); font-size: 11px; fill: var(--dim); }

  #msg { padding: 8px 12px; border-top: 1px solid var(--line); font-family: var(--mono);
    font-size: 11.5px; min-height: 34px; white-space: pre-wrap; }
  #msg.err { color: var(--red); }
  #msg.warn { color: var(--amber); }
  #msg.ok { color: var(--green); }

  /* --- 回路図 --- */
  .node rect.body { fill: #232833; stroke: var(--line); stroke-width: 1.5; }
  .node.sel rect.body { stroke: var(--blue); stroke-width: 2; }
  .node text { font-family: var(--mono); font-size: 12px; fill: var(--fg); text-anchor: middle;
    dominant-baseline: central; pointer-events: none; }
  .node text.name { font-size: 11px; fill: var(--dim); }
  .node text.val { font-size: 11px; fill: var(--dim); }
  .node text.val.on { fill: #0c1a12; font-weight: 700; }
  /* 多ビットは 16 進なので桁が増える。等幅で少し小さく出す */
  .node text.val.wide { font-family: var(--mono); font-size: 9.5px; }
  .node text.konst.wide { font-family: var(--mono); font-size: 12px; }
  .node.reg rect.body { fill: #1f2836; stroke: #3d5f8f; }
  .node.reg text.name { fill: var(--blue); }
  .node.konst rect.body { fill: #2a2519; stroke: #6b5a2a; }
  .node.blk rect.body { fill: #1d2a28; stroke: #3f6f60; }
  .node text.blkname { font-size: 11.5px; fill: #7fd6b8; }
  .node text.pinlab { font-size: 9.5px; fill: var(--dim); }
  .node text.pinlab.l { text-anchor: start; }
  .node text.pinlab.r { text-anchor: end; }
  .node .blkline { stroke: #34564c; stroke-width: 1; }
  .node text.konst { font-size: 17px; font-weight: 700; fill: var(--amber); }

  /* 端子の名前を変えるときに部品の上に重ねる入力欄 */
  #renameBox {
    position: absolute; text-align: center; font-family: var(--mono); font-size: 12px;
    background: #0c0e12; color: var(--fg); border: 2px solid var(--blue); border-radius: 7px;
    padding: 0 4px; outline: none;
  }
  .node.dead rect.body { stroke-dasharray: 4 3; }
  .node.dead text { fill: #5b626f; }
  .node { cursor: grab; }

  .pin { fill: #3a4250; stroke: var(--line); stroke-width: 1; cursor: crosshair; }
  .pin.one { fill: var(--green); }
  .pin:hover { stroke: var(--blue); stroke-width: 2; }
  .pin.armed { fill: var(--blue); stroke: var(--blue); }

  /* 見えている線は当たり判定を持たない。クリックは下の太い .whit に任せる
     (visiblePainted のままだと線の真上を狙ったクリックがこちらに吸われる) */
  .wire { fill: none; stroke: #4b5262; stroke-width: 2; pointer-events: none; }
  .wire.one { stroke: var(--green); }
  .wire.dead { stroke: #363c48; stroke-dasharray: 4 3; }
  .whit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
  .wgroup:hover .wire { stroke: var(--red); }
  .rubber { fill: none; stroke: var(--blue); stroke-width: 2; stroke-dasharray: 5 4; pointer-events: none; }
  .band { fill: rgba(90, 162, 255, .10); stroke: var(--blue); stroke-width: 1;
    stroke-dasharray: 4 3; pointer-events: none; }
  .lamp { stroke: var(--line); stroke-width: 1.5; fill: #2a2f3a; }
  .lamp.one { fill: var(--green); stroke: var(--green); }
</style>
</head>
<body>

<header>
  <h1>verilog-wasm — 回路エディタ</h1>
  <span class="sub">部品を置いて配線すると、Verilog に変換 → WASM にコンパイル → その場で評価します</span>
  <a href="./index.html">テキスト版 ▸</a>
  <span class="stats" id="stats"></span>
</header>

<div class="bar">
  <span class="label">部品</span>
  <span id="palette"></span>
  <span class="sep"></span>
  <button id="undo" title="元に戻す (Ctrl+Z)">↶</button>
  <button id="redo" title="やり直す (Ctrl+Y)">↷</button>
  <button id="copy" title="選択をコピー (Ctrl+C)">コピー</button>
  <button id="pasteBtn" title="貼り付け (Ctrl+V)">貼り付け</button>
  <button id="del">削除 (Del)</button>
  <button id="renameBtn">名前 (F2)</button>
  <span class="label">幅</span>
  <input type="number" id="bitWidth" value="1" min="1" max="32"
    title="選んだ 入力 / 定数 / メモリ のビット幅。ゲートと出力は繋いだ先から決まる">
  <button id="openBlock" title="選んだ回路部品の中身を開いて編集する (ダブルクリックでも開く)">部品の中へ</button>
  <button id="clear">全部消す</button>
  <button id="fit">表示リセット</button>
  <span class="sep"></span>
  <span class="label">クロック</span>
  <button id="clock" class="primary">▷ 1 クロック</button>
  <button id="zero">メモリを 0 に</button>
  <span class="cyc" id="cyc"></span>
</div>

<div class="bar" id="blockBar" hidden>
  <span class="label">部品の中</span>
  <span class="cyc" id="crumb"></span>
  <button id="blockDone" class="primary">確定して戻る</button>
  <button id="blockCancel">取消して戻る</button>
</div>

<div class="bar">
  <span class="label">回路</span>
  <select id="presets" title="サンプルと保存した回路"></select>
  <input type="text" id="cname" placeholder="回路の名前" maxlength="32">
  <button id="save">保存</button>
  <button id="delSave">保存を削除</button>
  <button id="share">リンクをコピー</button>
  <button id="dlJson" title="回路を .json ファイルとして書き出す">.json を保存</button>
  <button id="loadJson" title="書き出した .json ファイルを読み込む">.json を読み込む</button>
  <input type="file" id="jsonFile" accept=".json,application/json" hidden>
  <button id="dlWasm" title="いまの回路をコンパイルした .wasm を保存">.wasm を保存</button>
  <span class="sep"></span>
  <span class="label">部品にする</span>
  <select id="blockPick" title="保存した回路を部品として置く"></select>
  <button id="placeBlock">置く</button>
  <button id="syncBlocks" title="置いてある部品の中身を、保存されている最新の内容に入れ替える">部品を更新</button>
</div>

<main id="main">
  <div id="canvasWrap">
    <svg id="svg" viewBox="0 0 900 480" preserveAspectRatio="xMidYMid meet">
      <g id="gWires"></g>
      <g id="gNodes"></g>
      <path id="rubber" class="rubber"></path>
      <rect id="band" class="band" width="0" height="0"></rect>
    </svg>
  </div>
  <div class="split v" id="splitV" title="ドラッグで幅を変える"></div>
  <aside id="aside">
    <div class="head">生成された Verilog</div>
    <div class="scroll"><pre id="verilog"></pre></div>
    <div class="split h" id="splitH" title="ドラッグで高さを変える"></div>
    <div class="head" id="tableHead">真理値表</div>
    <div class="scroll"><table id="truth"></table></div>
  </aside>
</main>

<div class="split h" id="splitW" title="ドラッグで高さを変える"></div>

<section id="wavePanel">
  <div class="bar wavebar">
    <span class="label">波形</span>
    <button id="clockN">▷</button>
    <input type="number" id="nclk" value="8" min="1" max="256" title="まとめて打つクロック数">
    <span class="label" style="text-transform:none">クロック</span>
    <button id="waveClear">波形をクリア</button>
    <label class="chk"><input type="checkbox" id="waveGates"> 内部の配線も出す</label>
    <span class="label" id="waveInfo" style="text-transform:none;margin-left:auto"></span>
  </div>
  <div id="waveScroll">
    <div id="waveRow">
      <svg id="waveNames"></svg>
      <svg id="waveSvg"></svg>
    </div>
  </div>
</section>

<div id="msg"></div>

<script type="module">
import { compile, CompileError } from '../src/compile.js';
import { WasmSimulator } from '../src/sim.js';
import {
  CLOCK, MAX_WIDTH, PARTS, blockPorts, checkName, clampValue, decodeCircuit,
  encodeCircuit, expandCircuit, insOf, outsOf, packCircuit, toVerilog, widthOf,
} from '../src/schematic.js';
import { SAMPLE_CIRCUITS } from '../src/samples.js';
import { el, hel, $ } from './dom.js';
import {
  BLOCK_PAD, BLOCK_W, CANVAS, H, PIN_PITCH, W,
  clamp, inPin, outPin, pinYs, sizeOf, wirePath,
} from './geometry.js';
import { readClip, readSaved, readWork, writeClip, writeSaved, writeWork } from './storage.js';
import { saveFile, safeName } from './download.js';
import { WAVE, renderWave as drawWave } from './wave.js';
import { MAX_TABLE_BITS, renderTable as drawTable } from './table.js';

const svg = $('svg');

// ------------------------------------------------------------------ 状態
let graph = { nodes: [], wires: [] };
let nextId = 1;
let selection = new Set();         // 選択中のノード id (複数)
let armed = null;                  // 配線の始点 {node, port}
let drag = null;                   // {ids, from:{id→{x,y}}, sx, sy, moved, snap}
let band = null;                   // {x0, y0, x1, y1, base} 範囲選択の矩形
let pan = null;                    // {sx, sy, x, y, k} Shift + 背景ドラッグでのスクロール
let sim = null, compiled = null;
let plan = null;                   // toVerilog の結果
let values = new Map();            // ノード id → 0 | 1 | null(不明)
let pinVals = new Map();           // `${回路部品の id}:${出力端子}` → 0 | 1 | null
let seq = 0;                       // 非同期コンパイルの世代番号
let cycles = 0;                    // 打ったクロックの回数
let frames = [];                  // 波形の列 [{label, v:{信号名: 0|1|null}}]

// 表示範囲 (viewBox)。Ctrl + ホイールで拡大縮小、背景ドラッグでスクロールする
const view = { x: 0, y: 0, w: CANVAS.w, h: CANVAS.h };

// ------------------------------------------------- 回路の読み込みと保存
// サンプルの定義は src/schematic.js 側 (テストからも使うため)、
// localStorage への出入りは web/storage.js 側にある。
// 保存した回路もサンプルと同じ圧縮形式なので、読み込み経路は 1 本で足りる。

// ---- 回路部品の中に入って編集する ------------------------------------------
//
// 「入る」= 部品の中身をそのまま canvas に開き、親の回路をスタックに積んでおく。
// 「確定して戻る」で、編集した中身を親の部品ノードに書き戻す。
// 各フレームには親を復元するのに必要なものを全部入れておく (親の回路・書き戻す
// ノードの id・パンくずの表示名・名前欄とリストの選択)。
let blockStack = [];

/**
 * いまの中身を親に畳み込んで、一番外側の回路の保存形式を返す。
 * 自動保存は常にこれを書く — 部品の中にいるあいだも、外側ごと残しておかないと
 * 「開き直したら部品の中身が回路全体になっていた」ことになる。
 */
function rootPacked() {
  let packed = packCircuit(graph);
  for (let i = blockStack.length - 1; i >= 0; i--) {
    const frame = blockStack[i];
    const outer = expandCircuit(frame.packed);
    const node = outer.nodes.find((n) => n.id === frame.blockId);
    if (node) { node.def = packed; node.ref = null; }
    packed = packCircuit(outer);
  }
  return packed;
}

/** 編集中の回路を黙って残す。次に開いたとき続きから始められる */
const autoSave = () => writeWork(rootPacked());

function loadGraph(compact, listValue = '', name = '') {
  graph = expandCircuit(compact);
  nextId = Math.max(0, ...graph.nodes.map((n) => n.id)) + 1;
  selection.clear();
  armed = null;
  frames = [];
  undoStack = [];
  redoStack = [];              // 別の回路になったので手順は捨てる
  $('presets').value = listValue;
  $('cname').value = name;
  resetView();
  return rebuild();          // 呼び出し側が読み込み完了を待てるように
}

/** サンプルと保存した回路を 1 つのリストにまとめる */
function refreshList(select = '') {
  const sel = $('presets');
  sel.textContent = '';
  sel.appendChild(new Option('— 回路を選ぶ —', ''));

  const samples = document.createElement('optgroup');
  samples.label = 'サンプル';
  for (const name of Object.keys(SAMPLE_CIRCUITS)) samples.appendChild(new Option(name, `s:${name}`));
  sel.appendChild(samples);

  const names = Object.keys(readSaved()).sort();
  if (names.length) {
    const mine = document.createElement('optgroup');
    mine.label = '保存した回路';
    for (const name of names) mine.appendChild(new Option(name, `u:${name}`));
    sel.appendChild(mine);
  }
  sel.value = select;

  // 「部品にする」のリストも同じ顔ぶれ
  const pick = $('blockPick');
  const keep = pick.value;
  pick.textContent = '';
  if (names.length === 0) {
    pick.appendChild(new Option('（保存した回路がありません）', ''));
  } else {
    for (const name of names) pick.appendChild(new Option(name, name));
    if (names.includes(keep)) pick.value = keep;
  }
  pick.disabled = names.length === 0;
  $('placeBlock').disabled = names.length === 0;
  $('placeBlock').title = names.length === 0
    ? 'まず回路に名前を付けて保存してください' : '選んだ回路を 1 個の部品として置く';
}

function loadFromList(value) {
  if (!value) return Promise.resolve();
  const name = value.slice(2);
  try {
    return value.startsWith('s:')
      ? loadGraph(SAMPLE_CIRCUITS[name], value, '')
      : loadGraph(readSaved()[name], value, name);
  } catch (e) {
    setMsg(`読み込めませんでした: ${e.message}`, 'err');
    return Promise.resolve();
  }
}

// ------------------------------------------------------------ ジオメトリ
// 寸法の計算そのものは web/geometry.js にある (状態を持たないので)
const spec = (n) => PARTS[n.type];

function pinPos(nodeId, port, isInput) {
  const n = byId(nodeId);
  const p = isInput ? inPin(n, port) : outPin(n, port);
  return { x: n.x + p.x, y: n.y + p.y };
}

// 部品と配線の索引。描画は配線ごと・端子ごとに引くので、線形探索だと二乗になる。
// 索引は「配列そのものが差し替わった」か「長さが変わった」のを見て作り直す。
// 中身の書き換え (座標や値) は同じオブジェクトを指したままなので張り替えは要らない。
let nodeIdx = { arr: null, map: new Map() };
let wireIdx = { arr: null, map: new Map() };

function byId(id) {
  if (nodeIdx.arr !== graph.nodes || nodeIdx.map.size !== graph.nodes.length) {
    nodeIdx = { arr: graph.nodes, map: new Map(graph.nodes.map((n) => [n.id, n])) };
  }
  return nodeIdx.map.get(id);
}

/** その入力端子を駆動している配線 */
function driverOf(nodeId, port) {
  if (wireIdx.arr !== graph.wires || wireIdx.map.size !== graph.wires.length) {
    wireIdx = {
      arr: graph.wires,
      map: new Map(graph.wires.map((w) => [`${w.to.node}:${w.to.port}`, w])),
    };
  }
  return wireIdx.map.get(`${nodeId}:${port}`);
}

// -------------------------------------------------------- 元に戻す / やり直し
// スナップショットは保存形式 (packCircuit) をそのまま使う。回路まるごとを積むので
// 差分を考えなくて済む。1 回路あたり数 KB なので 60 手ぶんでも軽い。
const MAX_UNDO = 60;
let undoStack = [];
let redoStack = [];

/** 変更を加える *前* に呼ぶ。drag のように事後になる操作は snap を渡す */
function pushUndo(snap = packCircuit(graph)) {
  undoStack.push(snap);
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack = [];
  updateEditUI();
}

function applySnapshot(snap) {
  graph = expandCircuit(snap);
  nextId = Math.max(0, ...graph.nodes.map((n) => n.id)) + 1;
  selection.clear();
  armed = null;
  return rebuild();
}

function undo() {
  if (undoStack.length === 0) { setMsg('これ以上戻せません', 'warn'); return; }
  redoStack.push(packCircuit(graph));
  applySnapshot(undoStack.pop());
  updateEditUI();
}

function redo() {
  if (redoStack.length === 0) { setMsg('やり直せる操作がありません', 'warn'); return; }
  undoStack.push(packCircuit(graph));
  applySnapshot(redoStack.pop());
  updateEditUI();
}

function updateEditUI() {
  $('undo').disabled = undoStack.length === 0;
  $('redo').disabled = redoStack.length === 0;
  $('copy').disabled = selection.size === 0;
  $('del').disabled = selection.size === 0;
  $('renameBtn').disabled = selection.size !== 1;
  $('dlWasm').disabled = compiled === null;

  const one = selection.size === 1 ? byId([...selection][0]) : null;
  $('openBlock').disabled = one?.type !== 'block';

  // 幅の欄は、幅を持てる部品を選んでいるときだけ触れる
  const sized = sizedSelection();
  $('bitWidth').disabled = sized.length === 0;
  if (sized.length > 0) {
    const ws = new Set(sized.map((n) => widthOf(n)));
    $('bitWidth').value = ws.size === 1 ? [...ws][0] : '';
  }

  // 部品の中にいるあいだは「回路そのもの」を相手にする操作を止める。
  // 中身に別の部品を置くのは階層として筋が通るので、そちらは触らない。
  const inBlock = blockStack.length > 0;
  if ($('blockBar').hidden === inBlock) {     // 表示が変わるときだけ行数を組み直す
    $('blockBar').hidden = !inBlock;
    applyPanes();
  }
  $('crumb').textContent = blockStack.map((f) => f.label).join(' › ');
  for (const id of ['presets', 'cname', 'save', 'delSave', 'share', 'dlJson', 'loadJson']) {
    $(id).disabled = inBlock;
  }
  if (!inBlock) $('dlJson').disabled = graph.nodes.length === 0;
}

// ------------------------------------------------------------ 編集操作
function addNode(type) {
  pushUndo();
  // 入力は左・ゲートは中央・出力は右に、同種の数だけ下にずらして置く
  const same = graph.nodes.filter((n) => n.type === type).length;
  const col = type === 'in' ? 40 : type === 'out' ? CANVAS.w - W - 40 : 300;
  const node = {
    id: nextId++, type,
    x: col + (type === 'in' || type === 'out' ? 0 : (same % 2) * (W + 40)),
    y: 40 + (same * 70) % (CANVAS.h - H - 60),
    value: 0,
  };
  graph.nodes.push(node);
  selection = new Set([node.id]);
  rebuild();
}

/** 選択している部品と、それに繋がる配線をまとめて消す */
function removeSelection() {
  if (selection.size === 0) return;
  pushUndo();
  graph.nodes = graph.nodes.filter((n) => !selection.has(n.id));
  graph.wires = graph.wires.filter((w) => !selection.has(w.from.node) && !selection.has(w.to.node));
  if (armed && selection.has(armed.node)) armed = null;
  selection.clear();
  rebuild();
}

function connect(from, to) {
  if (from.node === to.node) return;                       // 自分自身へは繋がない
  pushUndo();
  graph.wires = graph.wires.filter((w) => !(w.to.node === to.node && w.to.port === to.port));
  graph.wires.push({ from, to });                          // 入力端子は 1 本だけ (上書き)
  rebuild();
}

function disconnect(wire) {
  pushUndo();
  graph.wires = graph.wires.filter((w) => w !== wire);
  rebuild();
}

// ------------------------------------------------------ コピーと貼り付け
// クリップボードは localStorage にも置く。別のタブで開いた回路にも貼れる。
let clipboard = null;   // このタブでコピーしたもの (無ければ localStorage を見る)

function copySelection() {
  if (selection.size === 0) { setMsg('コピーする部品を選んでください', 'warn'); return false; }
  // 選択の *中で閉じている* 配線だけを持っていく
  clipboard = packCircuit({
    nodes: graph.nodes.filter((n) => selection.has(n.id)),
    wires: graph.wires.filter((w) => selection.has(w.from.node) && selection.has(w.to.node)),
  });
  writeClip(clipboard);
  setMsg(`部品 ${clipboard.nodes.length} 個 / 配線 ${clipboard.wires.length} 本をコピーしました`
    + '（Ctrl+V で貼り付け）', '');
  return true;
}

function cutSelection() {
  if (copySelection()) removeSelection();
}

/** 名前が空くまで _2, _3 … を足す。コピーした端子名を活かすため */
function freeName(base, taken) {
  if (!taken.has(base)) return base;
  for (let k = 2; k < 100; k++) {
    if (!taken.has(`${base}_${k}`)) return `${base}_${k}`;
  }
  return undefined;
}

const PASTE_OFFSET = 28;

function paste() {
  const clip = clipboard ?? readClip();
  if (!clip?.nodes?.length) { setMsg('貼り付けるものがありません', 'warn'); return; }

  let sub;
  try { sub = expandCircuit(clip); } catch (e) {   // 別タブ由来の壊れたデータ避け
    setMsg(`貼り付けられませんでした: ${e.message}`, 'err');
    return;
  }
  pushUndo();

  const taken = new Set(graph.nodes.map((n) => n.name).filter(Boolean));
  const idMap = new Map();
  const pasted = [];
  for (const n of sub.nodes) {
    const id = nextId++;
    idMap.set(n.id, id);
    const name = n.name ? freeName(n.name, taken) : undefined;
    if (name) taken.add(name);
    const node = {
      ...n, id,
      x: clamp(n.x + PASTE_OFFSET, 0, CANVAS.w - W),
      y: clamp(n.y + PASTE_OFFSET, 0, CANVAS.h - H),
    };
    if (name) node.name = name; else delete node.name;
    graph.nodes.push(node);
    pasted.push(id);
  }
  for (const w of sub.wires) {
    graph.wires.push({
      from: { node: idMap.get(w.from.node), port: w.from.port },
      to: { node: idMap.get(w.to.node), port: w.to.port },
    });
  }
  selection = new Set(pasted);      // すぐドラッグして動かせるように選択しておく
  rebuild();
}

// ---------------------------------------------------- 回路を部品として置く
// 中身は参照ではなく **その場でコピーして埋め込む**。保存や共有リンクが単体で
// 完結し、相手の localStorage に元の回路が無くても開けるのが理由。
// 元を直したときは「部品を更新」で埋め込みを差し替える。
async function placeBlock(name) {
  const def = readSaved()[name];
  if (!def) { setMsg('保存した回路を選んでください', 'warn'); return; }

  let ports;
  try {
    ports = blockPorts(def);
  } catch (e) {
    setMsg(`「${name}」は部品にできません: ${e.message}`, 'err');
    return;
  }
  if (ports.inputs.length === 0 && ports.outputs.length === 0) {
    setMsg(`「${name}」には入出力が無いので部品になりません`, 'warn');
    return;
  }

  pushUndo();
  const node = {
    id: nextId++, type: 'block', value: 0, ref: name, def, _ports: ports,
    // 回路部品は箱が広いので、ゲートの列 (x=300) と重ならない場所に置く
    x: 140, y: 24 + (graph.nodes.filter((n) => n.type === 'block').length * 116) % 348,
  };
  graph.nodes.push(node);
  selection = new Set([node.id]);
  await rebuild();          // rebuild もメッセージを出すので、待ってから上書きする
  setMsg(`「${name}」を部品として置きました（入力 ${ports.inputs.length} / 出力 ${ports.outputs.length}）`, 'ok');
}

/** 選んだ回路部品の中身を開く */
async function enterBlock(id = selection.size === 1 ? [...selection][0] : null) {
  const node = id === null ? null : byId(id);
  if (!node || node.type !== 'block') {
    setMsg('回路部品を 1 個だけ選んでください', 'warn');
    return;
  }
  blockStack.push({
    packed: packCircuit(graph),
    blockId: id,
    label: node.name || node.ref || '部品',
    cname: $('cname').value,
    preset: $('presets').value,
    // loadGraph が履歴を捨てるので、親のぶんは預かって戻るときに返す
    undo: undoStack,
    redo: redoStack,
  });
  await loadGraph(node.def, '', '');
  setMsg(`「${blockStack[blockStack.length - 1].label}」の中を開きました。`
    + '編集したら「確定して戻る」を押してください', 'ok');
}

/**
 * 部品の中から出る。commit なら編集した中身を親のノードに書き戻す。
 *
 * 書き戻すときに ref を切るのが要点。中身がローカルになったのに保存された回路への
 * 参照が残っていると、あとで「部品を更新」がこの編集を黙って上書きしてしまう。
 */
async function leaveBlock(commit) {
  const frame = blockStack[blockStack.length - 1];
  if (!frame) return;

  let edited = null;
  if (commit) {
    edited = packCircuit(graph);
    let ports;
    try {
      ports = blockPorts(edited);
    } catch (e) {
      setMsg(`この中身は部品にできません: ${e.message}`, 'err');
      return;                                   // 直せるように中に留まる
    }
    if (ports.inputs.length === 0 && ports.outputs.length === 0) {
      setMsg('入力も出力も無いので部品になりません (in / out を置いてください)', 'warn');
      return;
    }
  }

  blockStack.pop();
  const parent = expandCircuit(frame.packed);
  if (edited) {
    const node = parent.nodes.find((n) => n.id === frame.blockId);
    if (node) { node.def = edited; node.ref = null; }
  }
  // loadGraph → expandCircuit が端子を作り直し、筋の通らなくなった配線を落とす
  await loadGraph(packCircuit(parent), frame.preset, frame.cname);
  selection = new Set([frame.blockId]);
  // 親の履歴を返す。書き戻したときは「中身の編集」を 1 手として積む
  undoStack = edited ? [...frame.undo, frame.packed] : frame.undo;
  if (undoStack.length > MAX_UNDO) undoStack = undoStack.slice(-MAX_UNDO);
  redoStack = edited ? [] : frame.redo;
  render();
  updateEditUI();
  setMsg(commit
    ? `「${frame.label}」の中身を書き戻しました (この部品は保存した回路とは切り離されました)`
    : `「${frame.label}」の編集を取り消しました`, commit ? 'ok' : 'warn');
}

/** 置いてある部品の中身を、保存されている最新の内容に入れ替える */
async function syncBlocks() {
  const all = readSaved();
  const hit = graph.nodes.filter((n) => n.type === 'block' && n.ref && all[n.ref]);
  if (hit.length === 0) { setMsg('更新できる部品がありません', 'warn'); return; }

  pushUndo();
  const before = JSON.stringify(hit.map((n) => n.def));
  for (const n of hit) n.def = all[n.ref];
  // 端子が増減しているかもしれないので、検査を通して筋の通らない配線を落とす
  try {
    graph = expandCircuit(packCircuit(graph));
  } catch (e) {
    setMsg(`部品を更新できませんでした: ${e.message}`, 'err');
    undo();
    return;
  }
  const changed = before !== JSON.stringify(
    graph.nodes.filter((n) => n.type === 'block' && n.ref && all[n.ref]).map((n) => n.def));
  await rebuild();
  setMsg(changed ? `${hit.length} 個の部品を最新の内容に更新しました`
    : `${hit.length} 個の部品は既に最新でした`, 'ok');
}

function selectAll() {
  selection = new Set(graph.nodes.map((n) => n.id));
  render();
  updateEditUI();
}

// ------------------------------------------------- コンパイル & 評価
async function rebuild() {
  plan = toVerilog(graph);
  $('verilog').textContent = plan.source ?? '// 部品がありません';
  const my = ++seq;

  if (!plan.source) {
    sim = compiled = null;
    values = new Map();
    cycles = 0;
    frames = [];
    setMsg('部品を置いて配線してください。', '');
    render(); renderTable(); updateClockUI(); updateEditUI();
    return;
  }

  try {
    const c = compile(plan.source);
    const s = await WasmSimulator.create(c);
    if (my !== seq) return;                                 // 追い越されたら破棄
    compiled = c; sim = s;
    cycles = 0;                                             // 回路を組み替えたら状態は作り直し
    frames = [];
    const st = c.stats;
    $('stats').textContent = `nets=${st.nets} gates=${st.gates} regs=${st.regs} `
      + `state=${st.stateBytes}B wasm=${st.wasmBytes}B`;
    const dead = deadCount();
    // 幅の合わない所は未配線と同じく除外されるので、理由を分けて伝える
    const wErr = plan.widthErrors ?? [];
    setMsg(`コンパイル成功 — ${st.gates} ゲート`
      + (st.regs ? ` / ${st.regs} ビットのメモリ` : '')
      + `を ${st.wasmBytes} バイトの WASM に変換`
      + (wErr.length ? ` / 幅が合わない部品 (${wErr.join(', ')}) は回路から除外しました` : '')
      + (dead ? ` / 未配線の部品が ${dead} 個あるので回路から除外しました` : ''),
      dead || wErr.length ? 'warn' : 'ok');
  } catch (e) {
    if (my !== seq) return;
    sim = compiled = null;
    cycles = 0;
    frames = [];
    $('stats').textContent = '';
    setMsg(e instanceof CompileError ? e.message : `${e.name}: ${e.message}`, 'err');
  }
  evaluate('append');
  autoSave();          // 回路が変わるたびに編集中の内容を残す
  updateClockUI();
  updateEditUI();
}

function updateClockUI() {
  const n = compiled?.stats.regs ?? 0;
  $('clock').disabled = $('zero').disabled = $('clockN').disabled = $('nclk').disabled = n === 0;
  $('clock').title = n === 0 ? 'メモリ (DFF) を置くと使えます' : 'クロックを 1 回打つ';
  $('cyc').textContent = n === 0 ? '' : `cyc=${cycles}`;
}

/** その部品の入力端子が 1 つでも未配線か */
function unwired(node) {
  for (let p = 0; p < insOf(node); p++) if (!driverOf(node.id, p)) return true;
  return false;
}

/** 画面に見えている部品のうち、回路から除外されている数 (平坦化後の内部部品は数えない) */
function deadCount() {
  return graph.nodes.filter((n) => (n.type === 'block' ? unwired(n) : plan.incomplete.has(n.id))).length;
}

/** 出力端子の値。回路部品だけ端子ごとに別の値を持つ */
function outValue(nodeId, port = 0) {
  return byId(nodeId)?.type === 'block'
    ? (pinVals.get(`${nodeId}:${port}`) ?? null)
    : (values.get(nodeId) ?? null);
}

/** 入力を書き込んで eval し、全ノードの値を取り直す (描画はしない) */
function refreshValues() {
  values = new Map();
  pinVals = new Map();
  if (sim) {
    for (const i of plan.inputs) sim.setInput(i.name, byId(i.node).value ?? 0);
    sim.eval();
    const known = new Set(compiled.layout.signalTable.map((s) => s.name));
    const read = (id) => {
      const name = plan.signalOf.get(id);
      return known.has(name) && !plan.incomplete.has(id) ? Number(sim.get(name)) : null;
    };
    for (const n of graph.nodes) {
      if (n.type === 'block') {
        // 部品の中身は平坦化で別のノードになっているので、端子ごとに引き当てる
        values.set(n.id, null);
        for (let p = 0; p < outsOf(n); p++) {
          const flat = plan.outletOf.get(`${n.id}:${p}`);
          pinVals.set(`${n.id}:${p}`, flat === undefined ? null : read(flat));
        }
      } else {
        values.set(n.id, read(n.id));
      }
    }
  } else {
    // コンパイルできていない間も入力の値だけは見せる
    for (const n of graph.nodes) values.set(n.id, n.type === 'in' ? (n.value ?? 0) : null);
  }
}

/**
 * 値を取り直して全部描き直す。
 * @param {'append'|'replace'|null} mode 波形に列を足すか、今の列を書き換えるか、触らないか
 */
function evaluate(mode = null) {
  refreshValues();
  if (mode) sample(mode === 'append');
  render();
  renderTable();
  renderWave();
}

/** 入力をいじったとき: メモリがあれば「同じサイクル内の変化」なので今の列を書き換える */
const inputChanged = () => evaluate(hasRegs() ? 'replace' : 'append');
const hasRegs = () => (compiled?.stats.regs ?? 0) > 0;

/** クロックを n 回打つ (eval → commit → eval) */
function clockOnce(n = 1) {
  if (!sim || !hasRegs()) return;
  for (let i = 0; i < n; i++) {
    sim.step();
    cycles++;
    refreshValues();
    sample(true);
  }
  render();
  renderTable();
  renderWave();
  updateClockUI();
}

function setMsg(text, cls) {
  $('msg').textContent = text;
  $('msg').className = cls;
}

// ---------------------------------------------------------- 幅と値の見せ方
//
// 幅を自分で持つのは 入力 / 定数 / メモリ だけ。ゲートと出力は駆動元から
// 伝播した幅 (plan.widthOf) を使う — 表示のためだけなので、コンパイルできて
// いないときは宣言値に落とす。

/** 画面に出すときの幅 */
const dispWidth = (n) => plan?.widthOf?.get(n.id) ?? widthOf(n);

/** 幅 1 は 0/1、広いときは 16 進 (桁数は幅から決める) */
function fmtValue(v, w) {
  if (v === null || v === undefined) return '';
  if (w <= 1) return String(v ? 1 : 0);
  return Number(v).toString(16).toUpperCase().padStart(Math.ceil(w / 4), '0');
}

/** 選んでいる部品のうち幅を持てるもの */
const sizedSelection = () => [...selection].map(byId).filter((n) => n && spec(n).sized);

// ---------------------------------------------------------------- 描画
function render() {
  const gw = $('gWires'), gn = $('gNodes');
  gw.textContent = ''; gn.textContent = '';

  for (const w of graph.wires) {
    if (!byId(w.from.node) || !byId(w.to.node)) continue;
    const d = wirePath(pinPos(w.from.node, w.from.port, false), pinPos(w.to.node, w.to.port, true));
    const g = el('g', {
      class: 'wgroup',
      // テストから「どの端子からどの端子へ」を確かめられるように残す
      'data-from': `${w.from.node}:${w.from.port}`,
      'data-to': `${w.to.node}:${w.to.port}`,
    }, gw);
    const hit = el('path', { class: 'whit', d }, g);           // 太い透明な当たり判定
    const v = outValue(w.from.node, w.from.port);
    el('path', { class: `wire ${v === null ? 'dead' : v ? 'one' : ''}`, d }, g);
    hit.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      if (e.button === 0) disconnect(w);
    });
    el('title', {}, hit).textContent = 'クリックで切断';
  }

  for (const n of graph.nodes) {
    const v = values.get(n.id);
    const cls = ['node'];
    if (selection.has(n.id)) cls.push('sel');
    // 回路部品は値が 1 個に決まらないので、未配線の端子があるかどうかで判断する
    const dead = n.type === 'block' ? unwired(n) : v === null;
    if (dead) cls.push('dead');
    if (spec(n).reg) cls.push('reg');
    if (spec(n).konst) cls.push('konst');
    if (n.type === 'block') cls.push('blk');
    const g = el('g',
      { class: cls.join(' '), transform: `translate(${n.x} ${n.y})`, 'data-id': n.id }, gn);

    const size = sizeOf(n);
    el('rect', { class: 'body', x: 0, y: 0, width: size.w, height: size.h, rx: 7 }, g);

    // 幅 1 は 0/1、広いときは 16 進。ランプは「0 でないか」で点ける
    const wOf = dispWidth(n);
    const label = (x) => (x === null || x === undefined ? '' : fmtValue(x, wOf));
    const lit = (x) => (x !== null && x !== undefined && x !== 0 ? 'one' : '');

    if (n.type === 'in') {
      el('text', { x: 22, y: H / 2 }, g).textContent = plan?.signalOf.get(n.id) ?? '?';
      el('circle', { class: `lamp ${lit(n.value)}`, cx: W - 20, cy: H / 2, r: 11 }, g);
      el('text', { class: `val ${lit(n.value) ? 'on' : ''} ${wOf > 1 ? 'wide' : ''}`, x: W - 20, y: H / 2 }, g)
        .textContent = label(n.value);
    } else if (n.type === 'const') {
      // 定数はポートではないので名前は出さず、値だけを大きく出す
      el('text', { class: `konst ${wOf > 1 ? 'wide' : ''}`, x: W / 2, y: H / 2 }, g)
        .textContent = label(n.value);
    } else if (n.type === 'out') {
      el('text', { class: 'name', x: 22, y: H / 2 }, g).textContent = plan?.signalOf.get(n.id) ?? 'y';
      el('circle', { class: `lamp ${lit(v)}`, cx: W - 20, cy: H / 2, r: 11 }, g);
      el('text', { class: `val ${lit(v) ? 'on' : ''} ${wOf > 1 ? 'wide' : ''}`, x: W - 20, y: H / 2 }, g)
        .textContent = label(v);
    } else if (n.type === 'dff') {
      // メモリは中身が見えないと意味がないので、Q の値をランプで出す
      el('text', { class: 'name', x: 20, y: H / 2 }, g).textContent = n.name || 'DFF';
      el('circle', { class: `lamp ${lit(v)}`, cx: W - 18, cy: H / 2, r: 10 }, g);
      el('text', { class: `val ${lit(v) ? 'on' : ''} ${wOf > 1 ? 'wide' : ''}`, x: W - 18, y: H / 2 }, g)
        .textContent = label(v);
    } else if (n.type === 'block') {
      // 中身は見せず、名前と端子の名札だけ出す
      el('text', { class: 'blkname', x: size.w / 2, y: 15 }, g).textContent = n.ref ?? '回路部品';
      el('line', { class: 'blkline', x1: 8, y1: 26, x2: size.w - 8, y2: 26 }, g);
      insOf(n) && pinYs(n, insOf(n)).forEach((y, i) => {
        el('text', { class: 'pinlab l', x: 10, y }, g).textContent = n._ports.inputs[i];
      });
      outsOf(n) && pinYs(n, outsOf(n)).forEach((y, i) => {
        el('text', { class: 'pinlab r', x: size.w - 10, y }, g).textContent = n._ports.outputs[i];
      });
    } else {
      el('text', { x: W / 2, y: H / 2 }, g).textContent = spec(n).glyph;
    }

    for (let p = 0; p < insOf(n); p++) {
      const q = inPin(n, p);
      const dv = driverOf(n.id, p);
      const pv = dv ? outValue(dv.from.node, dv.from.port) : null;
      const c = el('circle', { class: `pin ${pv === 1 ? 'one' : ''}`, cx: q.x, cy: q.y, r: 6 }, g);
      c.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        if (e.button !== 0) return;
        if (armed) { connect(armed, { node: n.id, port: p }); armed = null; }
        else if (dv) disconnect(dv);                          // 始点がなければ切断
      });
    }
    for (let p = 0; p < outsOf(n); p++) {
      const q = outPin(n, p);
      const isArmed = armed && armed.node === n.id && armed.port === p;
      const ov = outValue(n.id, p);
      const c = el('circle',
        { class: `pin ${isArmed ? 'armed' : ov === 1 ? 'one' : ''}`, cx: q.x, cy: q.y, r: 6 }, g);
      c.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        if (e.button !== 0) return;
        armed = isArmed ? null : { node: n.id, port: p };
        render();
      });
    }

    g.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      if (e.button !== 0) {                                 // 右クリックは掴まない
        selection = new Set([n.id]);
        render(); updateEditUI();
        return;
      }
      armed = null;
      if (e.shiftKey || e.ctrlKey || e.metaKey) {           // 選択に足す / 外す
        selection.has(n.id) ? selection.delete(n.id) : selection.add(n.id);
        render(); updateEditUI();
        return;
      }
      // 選択外の部品を掴んだらそれ 1 個の選択に切り替える。選択内ならまとめて動かす
      if (!selection.has(n.id)) selection = new Set([n.id]);
      const pt = toUser(e);
      const from = new Map();
      for (const id of selection) {
        const m = byId(id);
        if (m) from.set(id, { x: m.x, y: m.y });
      }
      drag = { ids: [...selection], from, sx: pt.x, sy: pt.y, moved: false, snap: packCircuit(graph) };
      svg.setPointerCapture(e.pointerId);
      render(); updateEditUI();
    });
    g.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();
      selection = new Set([n.id]);
      startRename(n.id);
    });
  }
  $('rubber').setAttribute('d', '');
  renderBand();
}

/** 範囲選択の矩形 */
function renderBand() {
  const r = $('band');
  if (!band) { r.setAttribute('width', 0); r.setAttribute('height', 0); return; }
  r.setAttribute('x', Math.min(band.x0, band.x1));
  r.setAttribute('y', Math.min(band.y0, band.y1));
  r.setAttribute('width', Math.abs(band.x1 - band.x0));
  r.setAttribute('height', Math.abs(band.y1 - band.y0));
}

// ---------------------------------------------------------------- 波形
// 1 列 = クロック 1 回。組合せ回路にはクロックがないので、入力を変えるたびに 1 列進める。
// メモリのある回路では入力の変化は「同じサイクル内の出来事」なので今の列を書き換える。
function sample(append) {
  const v = {};
  for (const n of graph.nodes) {
    const name = plan?.signalOf.get(n.id);
    if (name) v[name] = values.get(n.id) ?? null;
  }
  for (const [key, flat] of plan?.outletOf ?? []) {
    const name = plan.signalOf.get(flat);
    if (name) v[name] = pinVals.get(key) ?? null;
  }
  const label = hasRegs() ? cycles : frames.length;
  if (append || frames.length === 0) frames.push({ label, v });
  else frames[frames.length - 1] = { label: frames[frames.length - 1].label, v };
  if (frames.length > WAVE.max) frames.shift();
}

/** 波形に出す信号。既定は入力・メモリ・出力だけ (ゲートは数が多いので任意) */
function waveRows() {
  if (!plan) return [];
  const rows = [
    ...plan.inputs.map((i) => ({ ...i, kind: 'in' })),
    ...plan.regs,
    // 回路部品の出力端子。中身は見えないので、端子の値は既定で出す
    ...[...plan.outletOf.values()]
      .map((flat) => ({
        node: flat, name: plan.signalOf.get(flat), kind: 'block',
        width: plan.widthOf?.get(flat) ?? 1,
      }))
      .filter((r) => r.name),
    ...plan.outputs.filter((o) => o.kind === 'out'),
  ];
  if ($('waveGates').checked) rows.push(...plan.outputs.filter((o) => o.kind === 'gate'));
  // width は plan.inputs / outputs には入っているが、念のため落とさないよう埋める
  return rows.map((r) => ({ ...r, width: r.width ?? plan.widthOf?.get(r.node) ?? 1 }));
}

// 波形のカーソル。列番号 (frames の添字) か null。
// クロックを打つと列が増え、上限を超えると frames が前から落ちるので、
// 範囲外になったら末尾に寄せる (何も無くなったら外す)。
let waveCursor = null;

function renderWave() {
  if (waveCursor !== null && waveCursor >= frames.length) {
    waveCursor = frames.length ? frames.length - 1 : null;
  }
  drawWave(frames, waveRows(), { perClock: hasRegs(), ready: !!sim, cursor: waveCursor });
}

/** 波形の列を指す。範囲外なら何もしない。同じ列をもう一度指すと外す */
function setWaveCursor(col, toggle = false) {
  if (frames.length === 0) return;
  const c = Math.max(0, Math.min(frames.length - 1, col));
  waveCursor = toggle && waveCursor === c ? null : c;
  renderWave();
}

// ------------------------------------------------ 真理値表 / 状態遷移表
// どちらも 64 レーンのビットスライスで作る。全パターンをレーンに並べて
// eval() を 1 回 (メモリがあれば step 相当を 1 回) 呼ぶだけで表が埋まる。
//
// メモリがある回路では「入力 + 現在の Q」を並べて、出力と次の Q を読む。
// 出力は commit の前・次の Q は commit の後に読む必要があるので順番が要る。
function renderTable() {
  drawTable(plan, sim, (nodeId) => (byId(nodeId)?.value ? 1 : 0));
}

// ------------------------------------------------------ 端子の名前を変える
// 部品の上に input を重ねて出す。Enter で確定・Escape で取り消し・空にすると自動名に戻る。
function startRename(id) {
  const n = byId(id);
  if (!n) return;
  if (!spec(n).named) {
    setMsg(`${spec(n).label} には名前を付けられません (入力・出力・メモリだけ)`, 'warn');
    return;
  }
  document.getElementById('renameBox')?.remove();

  const g = $('gNodes').querySelector(`[data-id="${id}"]`);
  const r = g.getBoundingClientRect();
  const wrap = $('canvasWrap').getBoundingClientRect();
  const inp = document.createElement('input');
  inp.id = 'renameBox';
  inp.type = 'text';
  inp.spellcheck = false;
  inp.value = n.name ?? plan?.signalOf.get(id) ?? '';
  Object.assign(inp.style, {
    left: `${r.x - wrap.x}px`, top: `${r.y - wrap.y}px`,
    width: `${Math.max(r.width, 84)}px`, height: `${r.height}px`,
  });
  $('canvasWrap').appendChild(inp);
  inp.focus();
  inp.select();

  let done = false;
  const close = () => { done = true; inp.remove(); };
  const commit = () => {
    if (done) return;
    const v = inp.value.trim();
    close();
    if (v === (n.name ?? '')) return;
    if (v === '') { delete n.name; rebuild(); return; }   // 空 → 自動名に戻す
    const taken = new Set([CLOCK]);
    for (const [nodeId, name] of plan.signalOf) if (nodeId !== id) taken.add(name);
    const err = checkName(v, taken);
    if (err) { setMsg(err, 'err'); return; }
    n.name = v;
    rebuild();
  };
  inp.addEventListener('keydown', (e) => {
    e.stopPropagation();                                 // Space / Del を回路側に流さない
    if (e.key === 'Enter') commit();
    if (e.key === 'Escape') close();
  });
  inp.addEventListener('blur', commit);
}

/**
 * 幅 2 以上の 入力 / 定数 の値を打ち込む。名前の入力と同じ仕組みの箱を部品に重ねる。
 * 16 進で受け、`0x` も 10 進も通す。幅に収まらない値は丸める。
 */
function startValueEdit(id) {
  const n = byId(id);
  if (!n || (n.type !== 'in' && n.type !== 'const')) return;
  const w = widthOf(n);
  document.getElementById('renameBox')?.remove();

  const g = $('gNodes').querySelector(`[data-id="${id}"]`);
  const r = g.getBoundingClientRect();
  const wrap = $('canvasWrap').getBoundingClientRect();
  const inp = document.createElement('input');
  inp.id = 'renameBox';                     // CSS と後片付けを名前の箱と共用する
  inp.type = 'text';
  inp.spellcheck = false;
  inp.value = fmtValue(n.value ?? 0, w);
  inp.title = `${w} ビットの値を 16 進で入れる (0x を付けても可)`;
  Object.assign(inp.style, {
    left: `${r.x - wrap.x}px`, top: `${r.y - wrap.y}px`,
    width: `${Math.max(r.width, 84)}px`, height: `${r.height}px`,
  });
  $('canvasWrap').appendChild(inp);
  inp.focus();
  inp.select();

  let done = false;
  const close = () => { done = true; inp.remove(); };
  const commit = () => {
    if (done) return;
    const text = inp.value.trim();
    close();
    if (text === '') return;
    // 表示が 16 進なので入力も 16 進で読む (0x は付けても付けなくてもよい)
    const m = /^(?:0[xX])?([0-9a-fA-F]+)$/.exec(text);
    if (!m) { setMsg(`16 進の値として読めません: ${text}`, 'err'); return; }
    const parsed = Number.parseInt(m[1], 16);
    const v = clampValue(parsed, w);
    if (v === (n.value ?? 0)) return;
    if (n.type === 'const') pushUndo();
    n.value = v;
    n.type === 'in' ? inputChanged() : rebuild();
    if (v !== parsed) setMsg(`${w} ビットに収めて ${fmtValue(v, w)} にしました`, 'warn');
  };
  inp.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') commit();
    if (e.key === 'Escape') close();
  });
  inp.addEventListener('blur', commit);
}

// -------------------------------------------------- 表示範囲 (拡大縮小 / スクロール)
function applyView() {
  svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
}

function resetView() {
  Object.assign(view, { x: 0, y: 0, w: CANVAS.w, h: CANVAS.h });
  applyView();
}

$('canvasWrap').addEventListener('wheel', (e) => {
  if (!e.ctrlKey) return;                  // Ctrl なしのホイールはブラウザに任せる
  e.preventDefault();                      // Ctrl + ホイールの既定動作 (ブラウザのズーム) を止める
  const p = toUser(e);                     // カーソルの下にある点を固定して拡大縮小する
  const dy = e.deltaY * (e.deltaMode === 1 ? 33 : 1);
  const w = clamp(view.w * Math.exp(dy * 0.0015), CANVAS.w / 8, CANVAS.w * 4);
  const k = w / view.w;
  view.x = p.x - (p.x - view.x) * k;
  view.y = p.y - (p.y - view.y) * k;
  view.w = w;
  view.h *= k;
  applyView();
}, { passive: false });

// ------------------------------------------------------------ 入力操作
function toUser(e) {
  const m = svg.getScreenCTM().inverse();
  const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m);
  return { x: p.x, y: p.y };
}

// 背景のドラッグは範囲選択。Shift (か中ボタン) を足すとスクロールになる。
svg.addEventListener('pointerdown', (e) => {
  armed = null;
  svg.setPointerCapture(e.pointerId);
  if (e.shiftKey || e.button === 1) {
    const ctm = svg.getScreenCTM();
    pan = { sx: e.clientX, sy: e.clientY, x: view.x, y: view.y, k: 1 / ctm.a };
  } else {
    const pt = toUser(e);
    if (!(e.ctrlKey || e.metaKey)) selection.clear();     // Ctrl 付きなら今の選択に足す
    band = { x0: pt.x, y0: pt.y, x1: pt.x, y1: pt.y, base: new Set(selection) };
  }
  render();
  updateEditUI();
});

svg.addEventListener('pointermove', (e) => {
  const pt = toUser(e);
  if (drag) {
    // 選択している部品をまとめて動かす。ずれ量は全部で共通なので端で止める分も共通
    const dx = pt.x - drag.sx, dy = pt.y - drag.sy;
    let lox = Infinity, hix = -Infinity, loy = Infinity, hiy = -Infinity;
    for (const p of drag.from.values()) {
      lox = Math.min(lox, p.x); hix = Math.max(hix, p.x);
      loy = Math.min(loy, p.y); hiy = Math.max(hiy, p.y);
    }
    const ddx = clamp(dx, -lox, CANVAS.w - W - hix);
    const ddy = clamp(dy, -loy, CANVAS.h - H - hiy);
    for (const [id, p] of drag.from) {
      const n = byId(id);
      if (n) { n.x = p.x + ddx; n.y = p.y + ddy; }
    }
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) drag.moved = true;
    render();
  } else if (pan) {
    view.x = pan.x - (e.clientX - pan.sx) * pan.k;
    view.y = pan.y - (e.clientY - pan.sy) * pan.k;
    svg.classList.add('panning');
    applyView();
  } else if (band) {
    band.x1 = pt.x;
    band.y1 = pt.y;
    // 矩形に触れている部品を選ぶ (完全に囲まなくても掴める)
    const x = Math.min(band.x0, band.x1), y = Math.min(band.y0, band.y1);
    const x2 = Math.max(band.x0, band.x1), y2 = Math.max(band.y0, band.y1);
    selection = new Set(band.base);
    for (const n of graph.nodes) {
      const sz = sizeOf(n);
      if (n.x <= x2 && n.x + sz.w >= x && n.y <= y2 && n.y + sz.h >= y) selection.add(n.id);
    }
    render();
    updateEditUI();
  } else if (armed) {
    $('rubber').setAttribute('d', wirePath(pinPos(armed.node, armed.port, false), pt));
  }
});

svg.addEventListener('pointerup', (e) => {
  if (drag) {
    const n = drag.ids.length === 1 ? byId(drag.ids[0]) : null;
    if (drag.moved) {
      pushUndo(drag.snap);                         // 動かす前の状態を積む
      autoSave();
    }
    // 動かさずに離した = クリック → 入力と定数の値を変える。
    // 1 ビットならその場で反転、広いときは値を打ち込む箱を出す (16 進で何度も
    // クリックさせるのは現実的でないため)
    if (!drag.moved && (n?.type === 'in' || n?.type === 'const')) {
      if (widthOf(n) > 1) {
        startValueEdit(n.id);
      } else {
        if (n.type === 'const') pushUndo();
        n.value = n.value ? 0 : 1;
        n.type === 'in' ? inputChanged() : rebuild();   // 定数はリテラルなので作り直す
      }
    }
  }
  svg.releasePointerCapture?.(e.pointerId);
  svg.classList.remove('panning');
  drag = pan = null;
  if (band) { band = null; renderBand(); }
});

// 回路部品はダブルクリックで中を開く (フォルダを開く感覚に寄せる)
svg.addEventListener('dblclick', (e) => {
  const g = e.target.closest?.('.node');
  if (!g) return;
  const id = Number(g.dataset.id);
  if (byId(id)?.type !== 'block') return;
  e.preventDefault();
  selection = new Set([id]);
  enterBlock(id);
});

// ------------------------------------------------------ ペインの区切り
const main = $('main'), aside = $('aside');
let asideW = null, verilogH = null;   // null = CSS の初期比率のまま
let waveH = 150;                      // 波形パネルの高さ (px)

function applyPanes() {
  main.style.gridTemplateColumns = `1fr 7px ${asideW === null ? 'minmax(240px, 30%)' : `${asideW}px`}`;
  aside.style.gridTemplateRows = `auto ${verilogH === null ? '1fr' : `${verilogH}px`} 7px auto 1fr`;
  // header / 部品バー / [部品の中バー] / 回路バー / canvas / 区切り / 波形 / メッセージ。
  // 部品の中バーは hidden のあいだグリッドに入らないので、行もそのぶん減らす
  const rows = ['auto', 'auto'];
  if (!$('blockBar').hidden) rows.push('auto');
  rows.push('auto', '1fr', '7px', `${waveH}px`, 'auto');
  document.body.style.gridTemplateRows = rows.join(' ');
}

/** 区切りを押している間だけ onMove を呼ぶ */
function grabSplit(elm, onMove) {
  elm.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    elm.setPointerCapture(e.pointerId);
    elm.classList.add('active');
    const move = (ev) => { onMove(ev); applyPanes(); };
    const up = (ev) => {
      elm.releasePointerCapture(ev.pointerId);
      elm.classList.remove('active');
      elm.removeEventListener('pointermove', move);
      elm.removeEventListener('pointerup', up);
    };
    elm.addEventListener('pointermove', move);
    elm.addEventListener('pointerup', up);
  });
}

grabSplit($('splitV'), (e) => {
  asideW = clamp(window.innerWidth - e.clientX - 4, 160, window.innerWidth - 280);
});

grabSplit($('splitW'), (e) => {
  waveH = clamp(window.innerHeight - e.clientY - 40, 40, Math.max(40, window.innerHeight - 300));
});

grabSplit($('splitH'), (e) => {
  const heads = aside.querySelectorAll('.head');
  const top = heads[0].getBoundingClientRect().bottom;
  const room = aside.clientHeight - heads[0].offsetHeight - heads[1].offsetHeight - 7;
  verilogH = clamp(e.clientY - top, 40, Math.max(40, room - 40));
});

window.addEventListener('resize', () => {
  if (asideW !== null) asideW = clamp(asideW, 160, Math.max(160, window.innerWidth - 280));
  waveH = clamp(waveH, 40, Math.max(40, window.innerHeight - 300));
  applyPanes();
});

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;                   // 名前の入力中は何もしない
  const mod = e.ctrlKey || e.metaKey;
  const key = e.key.toLowerCase();

  if (mod) {
    if (key === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (key === 'y') { e.preventDefault(); redo(); return; }
    if (key === 'c') { e.preventDefault(); copySelection(); return; }
    if (key === 'x') { e.preventDefault(); cutSelection(); return; }
    if (key === 'v') { e.preventDefault(); paste(); return; }
    if (key === 'a') { e.preventDefault(); selectAll(); return; }
    return;                                                   // 他の Ctrl 系はブラウザに任せる
  }

  // カーソルを置いているあいだは矢印で列を送る (置いていないときは何もしない)
  if (waveCursor !== null && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    e.preventDefault();
    setWaveCursor(waveCursor + (e.key === 'ArrowRight' ? 1 : -1));
    return;
  }

  if (e.key === 'Escape') {
    if (waveCursor !== null) { waveCursor = null; renderWave(); }
    armed = null; selection.clear(); render(); updateEditUI();
  }
  if (e.key === ' ') { e.preventDefault(); clockOnce(); }     // スペースでクロック
  if (e.key === 'F2' && selection.size === 1) { e.preventDefault(); startRename([...selection][0]); }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    e.preventDefault();
    removeSelection();
  }
});

// ------------------------------------------------------------ ツールバー
for (const [type, p] of Object.entries(PARTS)) {
  if (p.internal || p.block) continue;      // 中継は内部用、回路部品は「部品にする」から置く
  const b = document.createElement('button');
  b.className = 'part';
  b.textContent = p.btn ?? p.glyph;
  b.title = `${p.label} を追加`;
  b.onclick = () => addNode(type);
  $('palette').appendChild(b);
}

$('presets').onchange = () => loadFromList($('presets').value);

$('save').onclick = () => {
  const name = $('cname').value.trim();
  if (!name) { setMsg('保存する名前を入れてください', 'warn'); return; }
  const all = readSaved();
  const overwrite = name in all;
  all[name] = packCircuit(graph);
  if (!writeSaved(all)) {
    setMsg('保存できませんでした (この環境では localStorage が使えないようです)', 'err');
    return;
  }
  refreshList(`u:${name}`);
  setMsg(`「${name}」を${overwrite ? '上書き' : '保存し'}ました `
    + `(部品 ${graph.nodes.length} 個 / 配線 ${graph.wires.length} 本)`, 'ok');
};

$('cname').onkeydown = (e) => { if (e.key === 'Enter') $('save').click(); };

$('delSave').onclick = () => {
  const value = $('presets').value;
  if (!value.startsWith('u:')) { setMsg('リストから保存した回路を選んでください', 'warn'); return; }
  const name = value.slice(2);
  const all = readSaved();
  delete all[name];
  writeSaved(all);
  refreshList('');
  setMsg(`「${name}」を削除しました (回路自体は開いたままです)`, 'ok');
};

$('share').onclick = async () => {
  const code = encodeCircuit(graph);
  const url = `${location.origin}${location.pathname}#c=${code}`;
  window.history.replaceState(null, '', `#c=${code}`);   // アドレス欄からもコピーできるように
  try {
    await navigator.clipboard.writeText(url);
    setMsg(`リンクをコピーしました (${url.length} 文字)`, 'ok');
  } catch {
    setMsg(`クリップボードが使えないので、アドレス欄からコピーしてください:\n${url}`, 'warn');
  }
};

// ---- .json の書き出し / 読み込み -------------------------------------------
//
// 中身は共有リンクと同じ保存形式 (packCircuit) なので、リンクと相互に行き来できる。
// 手で開いて読める / diff が取れるように、部品と配線は 1 行ずつ並べる。

function circuitToJson(name) {
  const c = packCircuit(graph);
  const rows = (arr) => (arr.length
    ? `[\n${arr.map((r) => `    ${JSON.stringify(r)}`).join(',\n')}\n  ]`
    : '[]');
  return `{\n  "name": ${JSON.stringify(name)},\n`
    + `  "nodes": ${rows(c.nodes)},\n`
    + `  "wires": ${rows(c.wires)}\n}\n`;
}

$('dlJson').onclick = () => {
  if (graph.nodes.length === 0) { setMsg('書き出す回路がありません', 'warn'); return; }
  const name = $('cname').value.trim();
  const file = `${safeName(name, 'circuit')}.json`;
  saveFile(file, circuitToJson(name), 'application/json');
  setMsg(`${file} を保存しました `
    + `(部品 ${graph.nodes.length} 個 / 配線 ${graph.wires.length} 本)`, 'ok');
};

$('loadJson').onclick = () => $('jsonFile').click();

$('jsonFile').onchange = async () => {
  const file = $('jsonFile').files[0];
  if (!file) return;
  $('jsonFile').value = '';          // 同じファイルをもう一度選んでも change が出るように
  try {
    const data = JSON.parse(await file.text());
    // name は expandCircuit が見ない追加フィールド。あれば名前欄に入れる
    const name = typeof data.name === 'string' ? data.name.slice(0, 32) : '';
    await loadGraph(data, '', name);
    setMsg(`${file.name} を読み込みました `
      + `(部品 ${graph.nodes.length} 個 / 配線 ${graph.wires.length} 本)`, 'ok');
  } catch (e) {
    setMsg(`${file.name} を読み込めませんでした: ${e.message}`, 'err');
  }
};

$('dlWasm').onclick = () => {
  if (!compiled) { setMsg('コンパイルできている回路がありません', 'warn'); return; }
  // 保存名があればそれを、なければ top モジュール名をファイル名にする
  const file = `${safeName($('cname').value || compiled.top, 'circuit')}.wasm`;
  saveFile(file, compiled.bytes, 'application/wasm');
  setMsg(`${file} を保存しました (${compiled.bytes.length} バイト)`, 'ok');
};

$('clear').onclick = () => {
  if (graph.nodes.length) pushUndo();
  graph = { nodes: [], wires: [] };
  selection.clear();
  armed = null;
  frames = [];
  $('stats').textContent = '';
  $('presets').value = '';
  rebuild();
};
$('del').onclick = removeSelection;
$('undo').onclick = undo;
$('redo').onclick = redo;
$('copy').onclick = copySelection;
$('pasteBtn').onclick = paste;
$('fit').onclick = resetView;
$('placeBlock').onclick = () => placeBlock($('blockPick').value);
$('syncBlocks').onclick = syncBlocks;
$('bitWidth').onchange = () => {
  const sized = sizedSelection();
  if (sized.length === 0) return;
  const w = Math.max(1, Math.min(MAX_WIDTH, Math.round(Number($('bitWidth').value) || 1)));
  if (sized.every((n) => widthOf(n) === w)) return;
  pushUndo();
  for (const n of sized) {
    n.w = w;
    n.value = clampValue(n.value ?? 0, w);   // 幅を狭めたら値も収める
  }
  rebuild();
  setMsg(`${sized.length} 個の部品を ${w} ビットにしました`, 'ok');
};

$('openBlock').onclick = () => enterBlock();
$('blockDone').onclick = () => leaveBlock(true);
$('blockCancel').onclick = () => leaveBlock(false);
$('renameBtn').onclick = () => {
  if (selection.size !== 1) setMsg('名前を変える部品を 1 個だけ選んでください', 'warn');
  else startRename([...selection][0]);
};
$('clock').onclick = () => clockOnce(1);
$('clockN').onclick = () => clockOnce(clamp(Number($('nclk').value) || 1, 1, 256));
$('waveClear').onclick = () => { frames = []; waveCursor = null; evaluate('append'); };

// 波形をクリックした列の値を読む。もう一度同じ列を押すとカーソルを外す
$('waveSvg').addEventListener('pointerdown', (e) => {
  const r = $('waveSvg').getBoundingClientRect();
  setWaveCursor(Math.floor((e.clientX - r.left) / WAVE.colW), true);
});
$('waveGates').onchange = renderWave;
$('zero').onclick = () => {
  if (!sim) return;
  sim.reset();                     // メモリを 0 に戻す (入力は evaluate が書き戻す)
  cycles = 0;
  frames = [];
  evaluate('append');
  updateClockUI();
};
applyPanes();
refreshList();

// 開くときに何を出すか。上から順に見て最初に見つかったものを使う。
//   1. #c=... の共有リンク
//   2. ?c=半加算器 のようなサンプル名の一部
//   3. 前回の編集中の回路 (自動保存)
//   4. 先頭のサンプル
async function openInitial() {
  const shared = new URLSearchParams(location.hash.slice(1)).get('c');
  let failed = null;
  if (shared) {
    try {
      await loadGraph(decodeCircuit(shared), '', '');
      return;
    } catch (e) {
      // 理由は代わりの回路を読んだ後に出す (rebuild がメッセージを上書きするため)
      failed = `共有リンクを読めませんでした: ${e.message}`;
    }
  }

  const names = Object.keys(SAMPLE_CIRCUITS);
  const wanted = new URLSearchParams(location.search).get('c');
  const hit = wanted && names.find((n) => n.includes(wanted));

  if (hit) {
    await loadFromList(`s:${hit}`);
  } else {
    const work = readWork();
    if (work?.nodes?.length) await loadGraph(work, '', '');
    else await loadFromList(`s:${names[0]}`);
  }
  if (failed) setMsg(failed, 'err');
}

await openInitial();
</script>
